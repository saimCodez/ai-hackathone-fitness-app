<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Goal | AI Fitness Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#0a0e14',
            surface: '#11181f',
            card: '#1a2330',
            borderDim: '#2a3645',
            primary: '#f97316',
            primarySoft: '#fb923c',
            primaryLight: '#fdba74',
            textLight: '#f1f5f9',
            textMuted: '#94a3b8',
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    * { scroll-behavior: smooth; }
    body { background: #0a0e14; }
    .glass-card {
      background: rgba(26, 35, 48, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(42, 54, 69, 0.3);
      transition: border-color 0.25s, box-shadow 0.3s, transform 0.3s;
    }
    .glass-card:hover {
      border-color: rgba(249, 115, 22, 0.4);
      box-shadow: 0 20px 40px -16px rgba(0,0,0,0.9), 0 0 0 1px rgba(249,115,22,0.1);
      transform: translateY(-4px);
    }
    .hover-lift {
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }
    .hover-lift:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px -12px rgba(249,115,22,0.25);
    }
    .glow-orange {
      animation: glowPulse 3s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(249,115,22,0.15); }
      50% { box-shadow: 0 0 40px rgba(249,115,22,0.35); }
    }
    .link-underline {
      position: relative;
      display: inline-block;
    }
    .link-underline::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0%;
      height: 2px;
      background: #f97316;
      transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .link-underline:hover::after {
      width: 100%;
    }
    ::-webkit-scrollbar { width: 6px; background: #11181f; }
    ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 40px; }
    /* spinning ring */
    .logo-ring {
      animation: spin 12s linear infinite;
    }
    .logo-ring-reverse {
      animation: spin 8s linear infinite reverse;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* FIX: Remove default white outline on focus */
    button:focus {
      outline: none !important;
    }
    button:focus-visible {
      outline: none !important;
    }
    *:focus {
      outline: none !important;
    }
    *:focus-visible {
      outline: none !important;
    }
    /* floating animation for logo */
    .float-logo {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    /* background decoration */
    .bg-decoration {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    /* goal card selected state */
    .goal-card {
      transition: all 0.3s ease;
      cursor: pointer;
      border: 2px solid rgba(42, 54, 69, 0.3);
      background: rgba(26, 35, 48, 0.5);
      backdrop-filter: blur(4px);
    }
    .goal-card:hover {
      border-color: rgba(249, 115, 22, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(249, 115, 22, 0.15);
    }
    .goal-card.selected {
      border-color: #f97316;
      background: rgba(249, 115, 22, 0.15);
      box-shadow: 0 0 30px -8px rgba(249, 115, 22, 0.2), inset 0 0 30px -8px rgba(249, 115, 22, 0.05);
    }
    .goal-card .check-mark {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .goal-card.selected .check-mark {
      opacity: 1;
    }
    /* navbar */
    .navbar-glass {
      background: rgba(17, 24, 31, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(42, 54, 69, 0.3);
    }
  </style>
</head>
<body class="min-h-screen bg-dark text-textLight antialiased">

  <!-- Background decorations -->
  <div class="bg-decoration w-96 h-96 bg-primary/5 top-20 -left-20"></div>
  <div class="bg-decoration w-96 h-96 bg-primary/5 bottom-20 -right-20"></div>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar-glass sticky top-0 z-50">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group relative">
        <div class="relative h-11 w-11 flex items-center justify-center float-logo">
          <div class="absolute inset-0 rounded-full border-2 border-primary/30 logo-ring"></div>
          <div class="absolute inset-0 rounded-full border-2 border-transparent border-t-primary/60 logo-ring-reverse"></div>
          <div class="h-9 w-9 rounded-xl bg-primary flex items-center justify-center text-dark font-black text-sm shadow-lg shadow-primary/30 group-hover:shadow-primary/50 transition-all relative z-10">AF</div>
        </div>
        <div class="hidden sm:block leading-tight">
          <div class="text-sm font-black tracking-tight">AI FITNESS</div>
          <div class="text-[10px] font-bold uppercase tracking-[0.18em] text-textMuted">premium coach</div>
        </div>
      </a>
      <div class="text-sm font-medium text-textMuted bg-card/50 px-4 py-2 rounded-full border border-borderDim/30">
        Step 2 of 5
      </div>
    </nav>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="min-h-[calc(100vh-80px)] flex items-center justify-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-4xl relative z-10">

      <!-- Heading -->
      <div class="text-center mb-10">
        <span class="text-xs font-bold text-primary tracking-[0.25em] uppercase">× your goal</span>
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-black mt-3 text-textLight">
          What Do You Want To Achieve?
        </h1>
        <p class="text-textMuted mt-3 text-sm sm:text-base">
          Choose the goal that best matches what you want to focus on.
        </p>
      </div>

      <!-- Goal Cards -->
      <div id="goal-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">

        <!-- Lose Weight -->
        <button type="button" data-goal="Lose Weight" class="goal-card rounded-2xl p-5 sm:p-6 text-left relative">
          <div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-primary flex items-center justify-center check-mark">
            <svg class="w-4 h-4 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="text-3xl sm:text-4xl mb-4">🎯</div>
          <h2 class="text-lg sm:text-xl font-black text-textLight">Lose Weight</h2>
          <p class="text-sm text-textMuted mt-2">Build healthy and consistent fitness habits.</p>
        </button>

        <!-- Gain Muscle -->
        <button type="button" data-goal="Gain Muscle" class="goal-card rounded-2xl p-5 sm:p-6 text-left relative">
          <div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-primary flex items-center justify-center check-mark">
            <svg class="w-4 h-4 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="text-3xl sm:text-4xl mb-4">💪</div>
          <h2 class="text-lg sm:text-xl font-black text-textLight">Gain Muscle</h2>
          <p class="text-sm text-textMuted mt-2">Focus on strength and resistance training.</p>
        </button>

        <!-- Stay Healthy -->
        <button type="button" data-goal="Stay Healthy" class="goal-card rounded-2xl p-5 sm:p-6 text-left relative">
          <div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-primary flex items-center justify-center check-mark">
            <svg class="w-4 h-4 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="text-3xl sm:text-4xl mb-4">❤️</div>
          <h2 class="text-lg sm:text-xl font-black text-textLight">Stay Healthy</h2>
          <p class="text-sm text-textMuted mt-2">Maintain healthy everyday habits.</p>
        </button>

        <!-- Improve Fitness -->
        <button type="button" data-goal="Improve Fitness" class="goal-card rounded-2xl p-5 sm:p-6 text-left relative">
          <div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-primary flex items-center justify-center check-mark">
            <svg class="w-4 h-4 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="text-3xl sm:text-4xl mb-4">⚡</div>
          <h2 class="text-lg sm:text-xl font-black text-textLight">Improve Fitness</h2>
          <p class="text-sm text-textMuted mt-2">Improve your overall fitness and activity.</p>
        </button>

      </div>

      <!-- Continue -->
      <div class="mt-8 text-center">
        <p id="goal-error" class="hidden text-red-400 text-sm mb-4">Please select a goal.</p>
        <button id="continue-btn" class="px-8 sm:px-10 py-3.5 sm:py-4 bg-primary text-dark font-bold rounded-2xl shadow-xl shadow-primary/25 hover:shadow-primary/40 hover:-translate-y-0.5 transition-all duration-300 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-primary/50">
          CONTINUE →
        </button>
      </div>

    </div>
  </main>

  <script>
    // Goal selection logic
    document.addEventListener('DOMContentLoaded', function() {
      const goalCards = document.querySelectorAll('.goal-card');
      const continueBtn = document.getElementById('continue-btn');
      const errorEl = document.getElementById('goal-error');
      let selectedGoal = null;

      goalCards.forEach(card => {
        card.addEventListener('click', function() {
          // Remove selected from all
          goalCards.forEach(c => c.classList.remove('selected'));
          // Add selected to this
          this.classList.add('selected');
          selectedGoal = this.dataset.goal;
          errorEl.classList.add('hidden');
        });
      });

      continueBtn.addEventListener('click', function() {
        if (!selectedGoal) {
          errorEl.classList.remove('hidden');
          return;
        }
        // Save goal and navigate
        localStorage.setItem('fitnessGoal', selectedGoal);
        window.location.href = 'bmi.html';
      });
    });
  </script>

</body>
</html>
